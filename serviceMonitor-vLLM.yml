---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels: { release: kube-prom }
spec:
  namespaceSelector: { matchNames: [inference] }
  selector:
    matchLabels: { app: vllm-14b }
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
