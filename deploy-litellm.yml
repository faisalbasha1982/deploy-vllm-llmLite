---
apiVersion: v1
kind: ConfigMap
metadata: { name: litellm-config, namespace: inference }
data:
  config.yaml: |
    model_list:
      - model_name: qwen-14b
        litellm_params:
          model: openai/Qwen/Qwen2.5-14B-Instruct
          api_base: http://vllm-14b.inference.svc.cluster.local:8000/v1
          api_key: "dummy"        # vLLM doesn't check it, but litellm requires the field
    litellm_settings:
      drop_params: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: litellm, namespace: inference }
spec:
  replicas: 1
  selector: { matchLabels: { app: litellm } }
  template:
    metadata: { labels: { app: litellm } }
    spec:
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        args: ["--config","/app/config.yaml","--port","4000"]
        ports: [{ containerPort: 4000 }]
        env:
        - { name: LITELLM_MASTER_KEY, value: "sk-1234" }   # change this
        volumeMounts:
        - { name: cfg, mountPath: /app/config.yaml, subPath: config.yaml }
      volumes:
      - { name: cfg, configMap: { name: litellm-config } }
---
apiVersion: v1
kind: Service
metadata: { name: litellm, namespace: inference }
spec:
  selector: { app: litellm }
  ports: [{ port: 4000, targetPort: 4000 }]
